services:
  postgres:
    image: postgres:17
    container_name: demo-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: demo
      POSTGRES_USER: root
      POSTGRES_PASSWORD: "123456"
    volumes:
      - demo-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d demo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  demo-pgdata:
