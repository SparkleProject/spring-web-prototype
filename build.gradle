plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '3.5.14'
    id 'com.avast.gradle.docker-compose' version '0.17.12'
}

group = 'com.demo'
version = '1.0.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(26)
    }
}

repositories {
    mavenCentral()
}

ext {
    springBootVersion = '3.5.14'
    druidVersion = '1.2.21'
    ehcacheCoreVersion = '2.6.11'
    sitemeshVersion = '3.2.1'
}

dependencies {
    implementation platform("org.springframework.boot:spring-boot-dependencies:${springBootVersion}")

    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-websocket'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    // spring-boot-starter-data-jpa includes JDBC
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JSP Support
    providedRuntime 'org.apache.tomcat.embed:tomcat-embed-jasper:10.1.40'
    implementation 'org.glassfish.web:jakarta.servlet.jsp.jstl:3.0.1'
    implementation 'jakarta.servlet.jsp.jstl:jakarta.servlet.jsp.jstl-api:3.0.2'

    // JPA / Hibernate
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // Liquibase
    implementation 'org.liquibase:liquibase-core'

    // Database
    implementation 'org.postgresql:postgresql:42.7.5'
    implementation "com.alibaba:druid:${druidVersion}"

    // Cache
    implementation "net.sf.ehcache:ehcache-core:${ehcacheCoreVersion}"

    // JSON
    implementation 'com.alibaba:fastjson:1.2.83'

    // SiteMesh
    implementation "org.sitemesh:sitemesh:${sitemeshVersion}"

    // Scheduling (pinned to 1.x due to Quartz 2.x API incompatibility)
    implementation('org.quartz-scheduler:quartz') {
        version { strictly '1.8.6' }
    }

    // Template
    implementation 'org.freemarker:freemarker'

    // Commons
    implementation 'org.apache.commons:commons-lang3'
    implementation 'commons-codec:commons-codec'
    implementation 'commons-fileupload:commons-fileupload:1.5'
    implementation 'commons-io:commons-io:2.15.1'
    implementation 'commons-beanutils:commons-beanutils:1.9.4'

    // HTTP Client
    implementation 'org.apache.httpcomponents:httpclient:4.5.14'
    implementation 'org.apache.httpcomponents:httpmime:4.5.14'

    // HTML Parser
    implementation 'org.jsoup:jsoup:1.17.2'

    // Jakarta Persistence (provided by spring-boot-starter-data-jpa)

    // Spring Test (for test base classes in src/main)
    implementation 'org.springframework:spring-test'

    // Test
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'junit:junit'
    testRuntimeOnly 'com.h2database:h2'
}

sourceSets {
    main {
        resources {
            srcDirs = ['src/main/resources']
        }
    }
}

war {
    archiveBaseName = 'demo'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnit()
}

dockerCompose {
    useComposeFiles = ['docker-compose.yml']
    waitForHealthyStateTimeout = java.time.Duration.ofMinutes(3)
}

tasks.named('bootRun') {
    dependsOn 'composeUp'
}

